services:
  mcp-proxy:
    image: nginx:1.30-alpine
    container_name: mcp-proxy
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./deploy/nginx/mcp.conf:/etc/nginx/conf.d/default.conf:ro
      # Long syntax with create_host_path: false. If the file is missing,
      # compose refuses to start instead of Docker creating an empty directory
      # at the mount point, which is what happened before.
      - type: bind
        source: ./deploy/nginx/.htpasswd
        target: /etc/nginx/.htpasswd
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - business-intelligence-mcp
      - api-integration-hub
      - content-automation-mcp
      - intelligence-mcp
      - fusional
    restart: unless-stopped
