---
# Bundle Manifest — Content Automation MCP
# Format version: 1
# --------------------------------------------------
# This file is the authoritative deployment contract for the
# content-automation-mcp showcase server.  Operators and automated tooling
# should treat every field below as required unless explicitly marked
# "optional".

manifest_version: "1"
bundle_version: "1.0.0"

name: content-automation-mcp
display_name: "Content Automation MCP"
description: >
  Web-scraping and RSS-parsing gateway.  Exposes MCP-compatible tools for
  extracting article text, harvesting hyperlinks, parsing HTML tables, and
  consuming RSS/Atom feeds — all behind a shared API-key auth and
  rate-limiting layer.

port: 8103
base_image: "python:3.11-slim"
dockerfile: "showcase-servers/content-automation-mcp/Dockerfile"

# --------------------------------------------------
# Startup order
# --------------------------------------------------
startup_order:
  position: 2                   # Peer to BI and API Hub; start after Redis (position 1)
  depends_on:
    - name: redis
      required: false           # Degrades gracefully to in-process rate-limiting when absent
      health_check: "redis-cli ping"

# --------------------------------------------------
# Python dependencies  (mirrors requirements.txt)
# --------------------------------------------------
dependencies:
  python_version: "3.11"
  packages:
    - name: fastapi
      version: "0.135.1"
    - name: "uvicorn[standard]"
      version: "0.41.0"
    - name: httpx
      version: "0.28.1"
    - name: beautifulsoup4
      version: "4.14.3"
    - name: lxml
      version: "6.0.2"
    - name: python-dotenv
      version: "1.2.2"
    - name: pydantic
      version: "2.12.5"
    - name: feedparser
      version: "6.0.12"
    - name: redis
      version: "7.3.0"
    - name: requests
      version: "2.32.5"
    - name: "mcp[cli]"
      version: "1.26.0"

# --------------------------------------------------
# Environment / configuration contract
# --------------------------------------------------
# required: true  → deployment will fail without this value
# required: false → optional; default applied when absent
# secret: true    → must never appear in logs or version control
env:
  - name: API_KEY
    required: true
    secret: true
    description: >
      Internal shared API key verified by the security middleware on every
      protected POST route.  Rotate by adding the new key to API_KEYS and
      removing the old one; keep old keys in REVOKED_API_KEYS until all
      clients have migrated.
    example: "change-me-before-production"

  - name: API_KEYS
    required: false
    secret: true
    description: >
      Comma-separated list of currently active API keys (rotation-friendly
      alternative to the single API_KEY value).  When present, all listed
      keys are accepted; API_KEY is treated as a legacy fallback.
    example: "key-primary,key-secondary"

  - name: REVOKED_API_KEYS
    required: false
    secret: true
    description: >
      Comma-separated list of previously valid API keys that must now be
      rejected.  Add old keys here after rotation.
    example: "old-key-1,old-key-2"

  - name: ANTHROPIC_API_KEY
    required: false
    secret: true
    description: >
      Anthropic API key.  Reserved for future AI-augmented content
      classification features.  Not required by current tools.
    example: "sk-ant-..."

  - name: ALLOWED_ORIGINS
    required: false
    default: "http://localhost,http://127.0.0.1"
    description: >
      Comma-separated list of CORS origins permitted to call this service.
    example: "https://app.example.com,http://localhost:5173"

  - name: ALLOWED_HOSTS
    required: false
    default: "localhost,127.0.0.1"
    description: >
      Comma-separated list of Host header values accepted by the server.
      Extend with the public hostname when deployed behind a reverse proxy.
    example: "localhost,content.example.com"

  - name: RATE_LIMIT_REQUESTS
    required: false
    default: "60"
    description: "Maximum number of requests allowed per RATE_LIMIT_WINDOW_SECONDS."
    example: "60"

  - name: RATE_LIMIT_WINDOW_SECONDS
    required: false
    default: "60"
    description: "Rolling window length (seconds) for rate limiting."
    example: "60"

  - name: REDIS_URL
    required: false
    description: >
      Redis connection URL used by the rate-limiter.  When absent the server
      falls back to an in-process store (not suitable for multi-replica
      deployments).
    example: "redis://redis:6379/0"

  - name: LOG_LEVEL
    required: false
    default: "INFO"
    description: "Python logging level: DEBUG | INFO | WARNING | ERROR | CRITICAL"
    example: "INFO"

  - name: LOG_HEALTH_REQUESTS
    required: false
    default: "false"
    description: "Set to 'true' to include /health requests in access logs."
    example: "false"

  - name: SERVICE_NAME
    required: false
    default: "Content Automation MCP"
    description: "Human-readable service name emitted in logs and observability headers."
    example: "Content Automation MCP"

  - name: PORT
    required: false
    default: "8103"
    description: "TCP port the uvicorn process listens on."
    example: "8103"

# --------------------------------------------------
# Health & readiness
# --------------------------------------------------
health_check:
  endpoint: "/health"
  method: GET
  expected_status: 200
  timeout_seconds: 5
  interval_seconds: 15

# --------------------------------------------------
# Key endpoints (informational)
# --------------------------------------------------
endpoints:
  - path: "/health"
    method: GET
    auth_required: false
    description: "Liveness/readiness probe."
  - path: "/scrape/article"
    method: POST
    auth_required: true
    description: "Extract the main article text from a URL."
  - path: "/scrape/links"
    method: POST
    auth_required: true
    description: "Harvest all hyperlinks from a URL."
  - path: "/scrape/tables"
    method: POST
    auth_required: true
    description: "Parse HTML tables from a URL and return them as structured data."
  - path: "/rss/parse"
    method: POST
    auth_required: true
    description: "Fetch and parse an RSS or Atom feed; returns structured entries."
  - path: "/mcp"
    method: "*"
    auth_required: true
    description: "Streamable HTTP MCP transport endpoint."
