---
# Bundle Manifest — Business Intelligence MCP
# Format version: 1
# --------------------------------------------------
# This file is the authoritative deployment contract for the
# business-intelligence-mcp showcase server.  Operators and
# automated tooling should treat every field below as required
# unless explicitly marked "optional".

manifest_version: "1"
bundle_version: "1.0.0"

name: business-intelligence-mcp
display_name: "Business Intelligence MCP"
description: >
  Natural-language → SQL gateway.  Accepts plain-English queries,
  translates them to read-only SQL via an LLM provider (Claude, rule-based
  fallback, or local stub), executes against a configured database, and
  returns structured results.

port: 8101
base_image: "python:3.11-slim"
dockerfile: "showcase-servers/business-intelligence-mcp/Dockerfile"

# --------------------------------------------------
# Startup order
# --------------------------------------------------
# Describes which services must be healthy BEFORE this bundle starts.
# startup_order.position is the recommended launch sequence when deploying
# the full kit together (lower = starts first).
startup_order:
  position: 2                   # Start after Redis (position 1); BI has no dependency on API Hub or Content
  depends_on:
    - name: redis
      required: false           # Degrades gracefully to in-process rate-limiting when Redis is absent
      health_check: "redis-cli ping"

# --------------------------------------------------
# Python dependencies  (mirrors requirements.txt)
# --------------------------------------------------
dependencies:
  python_version: "3.11"
  packages:
    - name: fastapi
      version: "0.135.1"
    - name: "uvicorn[standard]"
      version: "0.41.0"
    - name: sqlalchemy
      version: "2.0.48"
    - name: psycopg2-binary
      version: "2.9.11"
    - name: pymysql
      version: "1.1.2"
    - name: aiosqlite
      version: "0.22.1"
    - name: python-dotenv
      version: "1.2.2"
    - name: anthropic
      version: "0.84.0"
    - name: pydantic
      version: "2.12.5"
    - name: pytest
      version: "9.0.2"
    - name: redis
      version: "7.3.0"
    - name: requests
      version: "2.32.5"
    - name: "mcp[cli]"
      version: "1.26.0"
    - name: httpx
      version: "0.28.1"

# --------------------------------------------------
# Environment / configuration contract
# --------------------------------------------------
# required: true  → deployment will fail without this value
# required: false → optional; default applied when absent
# secret: true    → must never appear in logs or version control
env:
  - name: DB_URL
    required: true
    secret: true
    description: >
      SQLAlchemy connection string for the target database.
      SQLite example:  sqlite:///./test.db
      PostgreSQL example: postgresql://user:pass@host:5432/dbname
      MySQL example:      mysql+pymysql://user:pass@host:3306/dbname
    example: "sqlite:///./test.db"

  - name: ANTHROPIC_API_KEY
    required: false
    secret: true
    description: >
      Anthropic API key used when LLM_PROVIDER=claude (the default).
      Not required when LLM_PROVIDER=rule or LLM_PROVIDER=local.
    example: "sk-ant-..."

  - name: API_KEY
    required: true
    secret: true
    description: >
      Internal shared API key verified by the security middleware on every
      protected POST route.  Rotate by adding the new key to API_KEYS and
      removing the old one from that list; keep the old key in
      REVOKED_API_KEYS until all clients have migrated.
    example: "change-me-before-production"

  - name: API_KEYS
    required: false
    secret: true
    description: >
      Comma-separated list of currently active API keys (rotation-friendly
      alternative to the single API_KEY value).  When present, all listed
      keys are accepted; API_KEY is treated as a legacy fallback.
    example: "key-primary,key-secondary"

  - name: REVOKED_API_KEYS
    required: false
    secret: true
    description: >
      Comma-separated list of previously valid API keys that must now be
      rejected.  Add old keys here after rotation.
    example: "old-key-1,old-key-2"

  - name: ALLOWED_ORIGINS
    required: false
    default: "http://localhost,http://127.0.0.1"
    description: >
      Comma-separated list of CORS origins permitted to call this service.
    example: "https://app.example.com,http://localhost:5173"

  - name: ALLOWED_HOSTS
    required: false
    default: "localhost,127.0.0.1"
    description: >
      Comma-separated list of Host header values accepted by the server.
      Extend with the public hostname when deployed behind a reverse proxy.
    example: "localhost,bi.example.com"

  - name: RATE_LIMIT_REQUESTS
    required: false
    default: "60"
    description: "Maximum number of requests allowed per RATE_LIMIT_WINDOW_SECONDS."
    example: "60"

  - name: RATE_LIMIT_WINDOW_SECONDS
    required: false
    default: "60"
    description: "Rolling window length (seconds) for rate limiting."
    example: "60"

  - name: REDIS_URL
    required: false
    description: >
      Redis connection URL used by the rate-limiter.  When absent the server
      falls back to an in-process store (not suitable for multi-replica
      deployments).
    example: "redis://redis:6379/0"

  - name: LLM_PROVIDER
    required: false
    default: "claude"
    description: >
      Selects the NL→SQL backend.
      Accepted values: claude | rule | local
      "local" is a placeholder and not production-ready.
    example: "claude"

  - name: LOG_LEVEL
    required: false
    default: "INFO"
    description: "Python logging level: DEBUG | INFO | WARNING | ERROR | CRITICAL"
    example: "INFO"

  - name: LOG_HEALTH_REQUESTS
    required: false
    default: "false"
    description: "Set to 'true' to include /health requests in access logs."
    example: "false"

  - name: SERVICE_NAME
    required: false
    default: "Business Intelligence MCP"
    description: "Human-readable service name emitted in logs and observability headers."
    example: "Business Intelligence MCP"

  - name: PORT
    required: false
    default: "8101"
    description: "TCP port the uvicorn process listens on."
    example: "8101"

# --------------------------------------------------
# Health & readiness
# --------------------------------------------------
health_check:
  endpoint: "/health"
  method: GET
  expected_status: 200
  timeout_seconds: 5
  interval_seconds: 15

# --------------------------------------------------
# Key endpoints (informational)
# --------------------------------------------------
endpoints:
  - path: "/health"
    method: GET
    auth_required: false
    description: "Liveness/readiness probe."
  - path: "/query"
    method: POST
    auth_required: true
    description: "Submit a natural-language question; returns SQL + result rows."
  - path: "/mcp"
    method: "*"
    auth_required: true
    description: "Streamable HTTP MCP transport endpoint."

# --------------------------------------------------
# Prompt library
# --------------------------------------------------
prompt_library: "bundles/prompts/business-intelligence-mcp.prompts.md"
