---
# Bundle Manifest — API Integration Hub MCP
# Format version: 1
# --------------------------------------------------
# This file is the authoritative deployment contract for the
# api-integration-hub showcase server.  Operators and automated tooling
# should treat every field below as required unless explicitly marked
# "optional".

manifest_version: "1"
bundle_version: "1.0.0"

name: api-integration-hub
display_name: "API Integration Hub MCP"
description: >
  Unified gateway for third-party SaaS integrations.  Exposes MCP-compatible
  tools for sending Slack messages, creating GitHub issues (with optional Slack
  notifications), and looking up Stripe customers — all behind a shared API-key
  auth and rate-limiting layer.

port: 8102
base_image: "python:3.11-slim"
dockerfile: "showcase-servers/api-integration-hub/Dockerfile"

# --------------------------------------------------
# Startup order
# --------------------------------------------------
startup_order:
  position: 2                   # Peer to BI and Content; start after Redis (position 1)
  depends_on:
    - name: redis
      required: false           # Degrades gracefully to in-process rate-limiting when absent
      health_check: "redis-cli ping"

# --------------------------------------------------
# Python dependencies  (mirrors requirements.txt)
# --------------------------------------------------
dependencies:
  python_version: "3.11"
  packages:
    - name: fastapi
      version: "0.135.1"
    - name: "uvicorn[standard]"
      version: "0.41.0"
    - name: httpx
      version: "0.28.1"
    - name: python-dotenv
      version: "1.2.2"
    - name: pydantic
      version: "2.12.5"
    - name: redis
      version: "7.3.0"
    - name: requests
      version: "2.32.5"
    - name: "mcp[cli]"
      version: "1.26.0"

# --------------------------------------------------
# Environment / configuration contract
# --------------------------------------------------
# required: true  → deployment will fail without this value
# required: false → optional; default applied when absent
# secret: true    → must never appear in logs or version control
env:
  - name: API_KEY
    required: true
    secret: true
    description: >
      Internal shared API key verified by the security middleware on every
      protected POST route.  Rotate by adding the new key to API_KEYS and
      removing the old one; keep old keys in REVOKED_API_KEYS until all
      clients have migrated.
    example: "change-me-before-production"

  - name: API_KEYS
    required: false
    secret: true
    description: >
      Comma-separated list of currently active API keys (rotation-friendly
      alternative to the single API_KEY value).  When present, all listed
      keys are accepted; API_KEY is treated as a legacy fallback.
    example: "key-primary,key-secondary"

  - name: REVOKED_API_KEYS
    required: false
    secret: true
    description: >
      Comma-separated list of previously valid API keys that must now be
      rejected.  Add old keys here after rotation.
    example: "old-key-1,old-key-2"

  - name: SLACK_BOT_TOKEN
    required: false
    secret: true
    description: >
      Slack Bot User OAuth Token (xoxb-...).  Required to use the
      send_slack_message tool and optional GitHub-issue Slack notifications.
      Omit if Slack integration is not needed.
    example: "xoxb-..."

  - name: GITHUB_TOKEN
    required: false
    secret: true
    description: >
      GitHub Personal Access Token (or fine-grained token) with the
      "issues:write" scope on target repositories.  Required to use the
      create_github_issue tool.  Omit if GitHub integration is not needed.
    example: "ghp_..."

  - name: STRIPE_API_KEY
    required: false
    secret: true
    description: >
      Stripe secret key (sk_live_... or sk_test_...).  Required to use the
      lookup_stripe_customer tool.  Use a restricted key scoped to read-only
      customer operations in production.  Omit if Stripe integration is not
      needed.
    example: "sk_test_..."

  - name: ANTHROPIC_API_KEY
    required: false
    secret: true
    description: >
      Anthropic API key.  Reserved for future AI-augmented routing features.
      Not required by current tools.
    example: "sk-ant-..."

  - name: ALLOWED_ORIGINS
    required: false
    default: "http://localhost,http://127.0.0.1"
    description: >
      Comma-separated list of CORS origins permitted to call this service.
    example: "https://app.example.com,http://localhost:5173"

  - name: ALLOWED_HOSTS
    required: false
    default: "localhost,127.0.0.1"
    description: >
      Comma-separated list of Host header values accepted by the server.
      Extend with the public hostname when deployed behind a reverse proxy.
    example: "localhost,api.example.com"

  - name: RATE_LIMIT_REQUESTS
    required: false
    default: "60"
    description: "Maximum number of requests allowed per RATE_LIMIT_WINDOW_SECONDS."
    example: "60"

  - name: RATE_LIMIT_WINDOW_SECONDS
    required: false
    default: "60"
    description: "Rolling window length (seconds) for rate limiting."
    example: "60"

  - name: REDIS_URL
    required: false
    description: >
      Redis connection URL used by the rate-limiter.  When absent the server
      falls back to an in-process store (not suitable for multi-replica
      deployments).
    example: "redis://redis:6379/0"

  - name: LOG_LEVEL
    required: false
    default: "INFO"
    description: "Python logging level: DEBUG | INFO | WARNING | ERROR | CRITICAL"
    example: "INFO"

  - name: LOG_HEALTH_REQUESTS
    required: false
    default: "false"
    description: "Set to 'true' to include /health requests in access logs."
    example: "false"

  - name: SERVICE_NAME
    required: false
    default: "API Integration Hub MCP"
    description: "Human-readable service name emitted in logs and observability headers."
    example: "API Integration Hub MCP"

  - name: PORT
    required: false
    default: "8102"
    description: "TCP port the uvicorn process listens on."
    example: "8102"

# --------------------------------------------------
# Health & readiness
# --------------------------------------------------
health_check:
  endpoint: "/health"
  method: GET
  expected_status: 200
  timeout_seconds: 5
  interval_seconds: 15

# --------------------------------------------------
# Key endpoints (informational)
# --------------------------------------------------
endpoints:
  - path: "/health"
    method: GET
    auth_required: false
    description: "Liveness/readiness probe."
  - path: "/slack/message"
    method: POST
    auth_required: true
    description: "Send a message to a Slack channel."
  - path: "/github/issue"
    method: POST
    auth_required: true
    description: "Create a GitHub issue (and optionally post a Slack notification)."
  - path: "/stripe/customer"
    method: POST
    auth_required: true
    description: "Look up a Stripe customer by email or ID."
  - path: "/mcp"
    method: "*"
    auth_required: true
    description: "Streamable HTTP MCP transport endpoint."
